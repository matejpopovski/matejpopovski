name: Update README with Chess.com and LeetCode Stats

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour
  workflow_dispatch:  # Allows manual triggering of the workflow

permissions:
  contents: write  # lets the built-in GITHUB_TOKEN push the README update

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Update README with latest Chess.com and LeetCode stats
        run: python fetch_chess_stats.py  # Runs the updated Python script

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Commit and push changes
        run: |
          git add README.md
          git diff --cached --quiet && exit 0  # nothing changed, nothing to push
          git commit -m "Update README with latest Chess.com and LeetCode stats"
          git push
